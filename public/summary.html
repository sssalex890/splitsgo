<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Langkah 3 — Hasil Patungan | SplitGo</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <div class="container container--wide">
      <button type="button" class="back-btn" id="back-btn">&larr; Kembali</button>

      <nav class="steps" aria-label="Langkah">
        <div class="steps__item steps__item--done">
          <span class="steps__number">✓</span>
          <span class="steps__label">Grup &<br>Peserta</span>
        </div>
        <div class="steps__item steps__item--done">
          <span class="steps__number">✓</span>
          <span class="steps__label">Barang<br>Sewaan</span>
        </div>
        <div class="steps__item steps__item--active">
          <span class="steps__number">3</span>
          <span class="steps__label">Hasil<br>Patungan</span>
        </div>
      </nav>

      <header class="page-header">
        <h1 class="page-header__title">Berapa yang harus dibayar?</h1>
        <p class="page-header__subtitle">Ini rincian patungan per orang berdasarkan barang yang dipakai.</p>
        <p class="page-header__trip" id="trip-name"></p>
      </header>

      <div class="summary-total-banner" id="total-banner" hidden>
        <p class="summary-total-banner__label">Total semua biaya sewa</p>
        <p class="summary-total-banner__amount" id="grand-total"></p>
      </div>

      <div class="summary-grid" id="summary-grid"></div>

      <div class="btn-group">
        <a href="#" class="btn btn-whatsapp btn-lg btn-block" id="send-whatsapp" target="_blank" rel="noopener noreferrer">
          <svg class="btn__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          Kirim ke WhatsApp
        </a>
        <button type="button" class="btn btn-red btn-block" id="copy-summary">Salin Teks Saja</button>

        <div class="btn-group__divider"><span>atau</span></div>

        <a href="/" class="btn btn-restart btn-lg btn-block">
          <svg class="btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          Mulai dari Awal
        </a>
      </div>
    </div>
  </div>
  <footer class="footer">Langkah 3 dari 3 — Selesai!</footer>

  <script src="/js/api.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/back.js"></script>
  <script src="/js/summary.js"></script>
  <script>
    const _tripId = new URLSearchParams(window.location.search).get('tripId');
    setupBackButton('back-btn', `/add-items.html?tripId=${_tripId}`, 'Kembali untuk mengubah barang sewa? Hasil perhitungan perlu dihitung ulang.');
  </script>
</body>
</html>
